name: Scheduled Firestore Backup

on:
  schedule:
    # Runs daily at 02:00 AM UTC (9:00 PM EST)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions tab

jobs:
  backup:
    name: Backup Cloud Firestore
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Export Firestore Collections to JSON
        run: npm run db:backup

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firestore-backup-${{ github.sha }}
          path: backups/
          retention-days: 30
